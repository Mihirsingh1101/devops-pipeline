name: CI pipeline

on:
    push:
        branches: [ main ]

jobs:
    builds:
        runs-on: ubuntu-latest

    steps:
        -name: checkout-code
         uses: actions/checkout@v5

        -name: Setup node_js
         uses: actions/setup_node@v3
         with: 
            node-version: 16

         -name: Install dependencies
          run: npm Install

          -name: run test
           run: npm test


